<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#388bfd" stroke-width="3" stroke-opacity="0.6"/>

  <!-- S10 Monogram Brandmark -->
  <text x="64" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="54" letter-spacing="-2">
    <tspan fill="#ffffff">S</tspan><tspan fill="url(#blueGrad)">10</tspan>
  </text>

  <!-- Storage Drive LED & Track Indicator -->
  <rect x="32" y="93" width="64" height="6" rx="3" fill="#21262d"/>
  <rect x="32" y="93" width="28" height="6" rx="3" fill="url(#blueGrad)"/>
  <circle cx="88" cy="96" r="2.5" fill="#3fb950"/>
</svg>
